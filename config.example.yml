# Copy this file to config.yml. Replace the example repository before starting.
# config.yml is private and ignored by Git.
github:
  organization: example-org # Default owner for organization-owned Projects.
  username: your-github-login # Used by the "My Issues" and "My Pull Requests" shortcuts.

repositories:
  - name: My App
    url: /example-org/my-app
    project_number: null # Set a GitHub Projects v2 number to show workflow status.
    # For a user-owned Project, also set project_owner and project_owner_type: user.

# Map the exact option names used by your GitHub Projects v2 status field.
workflow:
  status_field: Status
  values:
    backlog: Backlog
    ready: Ready
    in_progress: In Progress
    in_review: In Review
    done: Done

priority:
  source: project # Or issue_field for an organization Issue Field.
  field: Priority

# Optional: people shown in Team and Brief.
team:
  - github: your-github-login
    name: Your Name

sync:
  interval_seconds: 300

